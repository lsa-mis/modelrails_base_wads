en:
  pages:
    home:
      hero:
        title: "Capstone Studio"
        subtitle: "A capstone is a semester-long team project at the end of a degree: a real problem, a faculty advisor, a proposal the instructor accepts, and a finish in public. This is where a course runs one."
        cta_primary: "Sign in"
        cta_signed_in: "Go to your courses"
        cta_secondary: "View documentation"
      features:
        title: "What a course gets"
        subtitle: "One course, its teams, and the record of what each team proposed and did."
        auth:
          title: "Sign in with a link"
          description: "No passwords to reset. Students and staff sign in with a link sent to their campus email."
        workspaces:
          title: "One space per course"
          description: "Each course offering is its own space with its own staff, students, teams, and settings. Nothing leaks between courses."
        projects:
          title: "Teams form themselves"
          description: "A student creates the team and adds teammates. Staff can open any team's page; students see only their own."
        resources:
          title: "Weekly notes in one place"
          description: "Each team keeps its notes and files where the instructor and advisor can read them, with a record of who changed what."
        realtime:
          title: "Proposals with a status"
          description: "A team registers its capstone and names an advisor, proposes it, and the instructor accepts it or sends it back. The status is always visible."
        security:
          title: "Staff see everything, students see their team"
          description: "Instructors and TAs read every team in their course. A student sees their own team and nothing else."
      cta:
        title: "Running a course with a capstone?"
        subtitle: "Courses are set up on request. Ask your department's team for one, and you will be invited to it."
        button: "Sign in"
        signed_in:
          title: "Welcome back"
          subtitle: "Your courses and teams are where you left them."
          button: "Go to your courses"
    about:
      hero:
        title: "About Capstone Studio"
        subtitle: "A service for courses that end in a team project."
      mission:
        title: "What it is for"
        description: "A capstone course asks teams of students to spend a semester on one real problem with a faculty advisor, propose it, get it accepted, and finish it in public. Instructors have been running that out of spreadsheets and shared mailboxes. Capstone Studio gives each course one place for its teams, their proposals, their advisors, and their weekly notes, with the instructor and TAs able to see all of it and students able to see their own team."
      features:
        title: "What a course gets"
        items:
          - "A space of its own, set up on request by the department"
          - "Sign-in by campus email, no passwords"
          - "Students form their own teams and add teammates"
          - "A proposal per team, with an advisor the team names"
          - "Accept or send back, with the status always visible"
          - "Weekly notes and files kept with the team"
          - "A record of who changed what, when"
          - "Staff see every team; students see theirs"
          - "Every page checked automatically at WCAG 2.2 AAA, light and dark"
      philosophy:
        title: "How it is run"
        conventions:
          title: "One service, many courses"
          description: "The department runs one application. A new course is a request to the service desk, who creates it and hands it to its instructor."
        accessibility:
          title: "Accessible by default"
          description: "Every page the tests render is checked automatically at WCAG 2.2 AAA, in light and dark mode, before it ships."
        testing:
          title: "Tested before it reaches you"
          description: "Every change runs the full test suite, including the accessibility audit, before it can be merged."
        extensible:
          title: "Built on a maintained template"
          description: "Capstone Studio is built on ModelRails and pulls its updates. The parts that are ours stay ours."
      title: "Privacy Policy"
      intro: "This privacy policy describes how Capstone Studio handles your information. We are committed to protecting your privacy and being transparent about our practices."
      collection:
        title: "Information we collect"
        items:
          - "Account information (name, email address) when you sign up"
          - "Authentication data (encrypted passwords, OAuth tokens)"
          - "Usage data (workspace activity, project interactions)"
          - "Technical data (IP address, browser type, session information)"
      usage:
        title: "How we use your information"
        items:
          - "To provide and maintain your account"
          - "To authenticate your identity"
          - "To send transactional emails (verification, password reset)"
          - "To track workspace activity for your audit trail"
      sharing:
        title: "Data sharing"
        description: "We do not sell your personal information. We share data only as necessary to provide our services, comply with legal obligations, or protect our rights."
      security:
        title: "Data security"
        description: "We implement industry-standard security measures including encrypted passwords, secure session management, rate-limited authentication, and sensitive data filtering in activity logs."
      rights:
        title: "Your rights"
        items:
          - "Access your personal data"
          - "Correct inaccurate information"
          - "Request deletion of your account"
          - "Export your data"
      contact_text: "For privacy-related inquiries, please visit our"
      contact_link: "contact page"
      updated: "Last updated"
    contact:
      title: "Contact Us"
      hero:
        title: "Get in touch"
        subtitle: "Have questions, feedback, or need help? We're here for you."
      methods:
        title: "Contact methods"
        email:
          title: "Email"
          description: "For general inquiries and support, write to %{address}."
          address: "support@capstone_studio.example"
        bugs:
          title: "Bug reports"
          description: "Found a bug? Report it on GitHub."
      community:
        title: "Community"
        github:
          title: "GitHub"
          description: "Browse the source code, contribute, or star the project."
        discussions:
          title: "Discussions"
          description: "Ask questions and share ideas with the community."
        docs:
          title: "Documentation"
          description: "Browse the technical documentation and guides."
